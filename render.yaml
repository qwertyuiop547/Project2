services:
  - type: web
    name: barangay-portal
    env: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate --schema=./server/prisma/schema.prisma
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barangay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: barangay-db
    plan: free
    databaseName: barangay_db
    user: barangay_user
