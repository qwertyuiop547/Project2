<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4AF37" />
      <stop offset="25%" stopColor="#FFFDD0" />
      <stop offset="50%" stopColor="#AA771C" />
      <stop offset="75%" stopColor="#FDF6C7" />
      <stop offset="100%" stopColor="#8B6508" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="256" cy="256" r="186" fill="#ffffff" filter="url(#glow)" />

  <!-- Quadrant Colors -->
  <g transform="translate(256, 256) scale(2.2) translate(-100, -100)">
    <circle cx="100" cy="100" r="75" fill="#f8fafc" />
    <path d="M 100 100 L 175 100 A 75 75 0 0 0 100 25 Z" fill="#1e3a8a" />
    <path d="M 100 100 L 175 100 A 75 75 0 0 1 100 175 Z" fill="#eab308" />
    <path d="M 100 100 L 25 100 A 75 75 0 0 0 100 175 Z" fill="#15803d" />
    <path d="M 100 100 L 25 100 A 75 75 0 0 1 100 25 Z" fill="#dc2626" />
    <circle cx="100" cy="100" r="54" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Shield / Center Icon -->
    <path d="M 100 62 Q 128 62 128 88 Q 128 122 100 138 Q 72 122 72 88 Q 72 62 100 62 Z" fill="#1e3a8a" />
    <!-- Golden Star in Shield -->
    <polygon points="100,75 103,84 112,84 105,90 108,99 100,93 92,99 95,90 88,84 97,84" fill="url(#goldGrad)" />
    <!-- Three Small Community Stars -->
    <polygon points="100,105 102,110 107,110 103,113 105,118 100,115 95,118 97,113 93,110 98,110" fill="#facc15" />
    <circle cx="90" cy="122" r="3" fill="#facc15" />
    <circle cx="110" cy="122" r="3" fill="#facc15" />
  </g>

  <!-- Typography -->
  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">
    BARANGAY BURGOS
  </text>
</svg>
