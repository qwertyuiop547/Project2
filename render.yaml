databases:
  - name: barangay-portal-db
    databaseName: barangay_portal_db
    user: barangay_user
    plan: free
    region: singapore

services:
  - type: web
    name: barangay-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install --include=dev && npm run build && cd server && npx prisma generate"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barangay-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
